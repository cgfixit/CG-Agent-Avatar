[package]
name = "cg-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Menu-bar creature companion for a running CG-Agent-Harness"
publish = false

[lib]
name = "cg_agent"
path = "src/lib.rs"

[[bin]]
name = "cg-agent"
path = "src/main.rs"

[dependencies]
# reqwest 0.13 with `rustls-no-provider`: reqwest's own `rustls` feature would
# select aws-lc-rs (C/cmake toolchain, ~30 extra crates). Keeping `ring`, the
# provider 0.12 used, means no change to what the app ships; `tls::ensure_crypto_provider`
# installs it before any client is built. TLS pinning is `tls_certs_only`
# (single leaf cert, no built-in or platform roots). This is the reviewed
# migration that previously held the crate on 0.12; see docs/BUILD.md.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSAttributedString", "NSObjCRuntime", "NSGeometry", "NSDate", "NSTimer", "NSRunLoop", "NSNotification", "NSThread", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    "block2",
    "NSResponder",
    "NSWindow",
    "NSPanel",
    "NSView",
    "NSControl",
    "NSButton",
    "NSAttributedString",
    "NSAlert",
    "NSSecureTextField",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSColor",
    "NSEvent",
    "NSTextField",
    "NSTextView",
    "NSText",
    "NSScrollView",
    "NSFont",
    "NSScreen",
    "NSGraphics",
    "NSGraphicsContext",
    "NSTrackingArea",
    "NSCursor",
    "NSCell",
    "NSActionCell",
    "NSButtonCell",
    "NSAccessibilityProtocols",
    "NSAnimation",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGColor", "CGImage", "CGContext", "CGGeometry"] }

[dev-dependencies]
mockito = "1"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
