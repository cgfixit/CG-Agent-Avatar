# Secret scan via pinned gitleaks CLI (not gitleaks-action: private repos need a license).
# Pinning: https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
# No pull_request_target. GITHUB_TOKEN read-only. No secrets.

name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks v8.30.1
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect
        run: gitleaks detect --source . --redact --verbose --exit-code 1
