# Darwin .app on every merge to main. Noon Eastern publishes a prerelease and
# never moves GitHub Latest. workflow_dispatch from main publishes a full
# release and, when mark_latest is true (the default), marks it Latest.
# Pinning:
# https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
# No pull_request_target. No cancel-in-progress (do not cancel a publish).
# contents: write only on the release job.

name: bundle

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mark_latest:
        description: On main, mark the full release as GitHub Latest (uncheck to publish without moving Latest)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          # Required by this action pin. Matches rust-toolchain.toml crate MSRV.
          toolchain: 1.88

      - name: Package .app
        run: ./scripts/package-app.sh

      - name: Zip .app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/CG-Agent-MacOS-Avatar.app \
            dist/CG-Agent-MacOS-Avatar.zip
          ls -la dist/CG-Agent-MacOS-Avatar.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CG-Agent-MacOS-Avatar
          path: dist/CG-Agent-MacOS-Avatar.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CG-Agent-MacOS-Avatar
          path: release-assets

      - name: Choose tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(TZ=America/New_York date +%F)
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TAG="nightly-${DATE}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG already exists"
              echo "skip=true" >> "$GITHUB_ENV"
              exit 0
            fi
            prev=$(gh release list --limit 50 --json tagName \
              --jq '[.[].tagName | select(startswith("nightly-"))][0] // empty')
            if [ -n "$prev" ]; then
              ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_SHA}" --jq .ahead_by)
              if [ "$ahead" = "0" ]; then
                echo "no new commits since $prev"
                echo "skip=true" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          else
            TAG="manual-${DATE}-${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Event payload, not the inputs context: schedule runs have no inputs.
          # Boolean inputs arrive as the strings "true" and "false".
          MARK_LATEST: ${{ github.event.inputs.mark_latest }}
        run: |
          set -euo pipefail
          ls -la release-assets
          # Tags are manual-* / nightly-*, not semver, so GitHub will not
          # infer Latest. Set it explicitly. Nightly, and a manual run from
          # any ref other than main, stays a prerelease and never Latest.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if [ "${MARK_LATEST}" = "true" ]; then
              release_flags=(--latest=true)
            else
              release_flags=(--latest=false)
            fi
          else
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "CG-Agent-MacOS-Avatar $TAG" \
            --notes "Ad-hoc signed Apple Silicon .app (not notarized). Commit ${GITHUB_SHA}. Gatekeeper may require Open anyway." \
            "${release_flags[@]}" \
            release-assets/CG-Agent-MacOS-Avatar.zip
