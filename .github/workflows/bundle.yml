# Darwin .app on every merge to main. Noon Eastern publishes a prerelease and
# never moves GitHub Latest. workflow_dispatch from main publishes a full
# release and, when mark_latest is true (the default), marks it Latest; an
# optional `notes` input is appended to the release notes. Every build is
# smoke-checked (arm64, bundle ID, ad-hoc signature) and ships a SHA-256 file.
# Pinning:
# https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
# No pull_request_target. No cancel-in-progress (do not cancel a publish).
# contents: write only on the release job.

name: bundle

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mark_latest:
        description: On main, mark the full release as GitHub Latest (uncheck to publish without moving Latest)
        type: boolean
        default: true
      notes:
        description: Optional release notes, appended below the standard verification steps
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Required by this action pin. Matches rust-toolchain.toml crate MSRV.
          toolchain: 1.88

      - name: Package .app
        run: ./scripts/package-app.sh

      - name: Smoke-check .app
        run: |
          set -euo pipefail
          app=dist/CG-Agent-MacOS-Avatar.app
          archs=$(lipo -archs "$app/Contents/MacOS/cg-agent")
          [ "$archs" = "arm64" ] || { echo "expected arm64, got: $archs"; exit 1; }
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          [ "$id" = "com.cgfixit.cg-agent" ] || { echo "unexpected bundle id: $id"; exit 1; }
          codesign --verify --strict --verbose=2 "$app"

      - name: Zip .app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/CG-Agent-MacOS-Avatar.app \
            dist/CG-Agent-MacOS-Avatar.zip
          (cd dist && shasum -a 256 CG-Agent-MacOS-Avatar.zip > CG-Agent-MacOS-Avatar.zip.sha256)
          ls -la dist/CG-Agent-MacOS-Avatar.zip dist/CG-Agent-MacOS-Avatar.zip.sha256
          cat dist/CG-Agent-MacOS-Avatar.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CG-Agent-MacOS-Avatar
          path: |
            dist/CG-Agent-MacOS-Avatar.zip
            dist/CG-Agent-MacOS-Avatar.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CG-Agent-MacOS-Avatar
          path: release-assets

      - name: Choose tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(TZ=America/New_York date +%F)
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TAG="nightly-${DATE}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG already exists"
              echo "skip=true" >> "$GITHUB_ENV"
              exit 0
            fi
            prev=$(gh release list --limit 50 --json tagName \
              --jq '[.[].tagName | select(startswith("nightly-"))][0] // empty')
            if [ -n "$prev" ]; then
              ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_SHA}" --jq .ahead_by)
              if [ "$ahead" = "0" ]; then
                echo "no new commits since $prev"
                echo "skip=true" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          else
            TAG="manual-${DATE}-${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Event payload, not the inputs context: schedule runs have no inputs.
          # Boolean inputs arrive as the strings "true" and "false".
          MARK_LATEST: ${{ github.event.inputs.mark_latest }}
          # Passed through env, never interpolated into the script body.
          USER_NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          ls -la release-assets
          # Tags are manual-* / nightly-*, not semver, so GitHub will not
          # infer Latest. Set it explicitly. Nightly, and a manual run from
          # any ref other than main, stays a prerelease and never Latest.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if [ "${MARK_LATEST}" = "true" ]; then
              release_flags=(--latest=true)
            else
              release_flags=(--latest=false)
            fi
          else
            release_flags=(--prerelease --latest=false)
          fi
          {
            echo "Ad-hoc signed Apple Silicon .app (not notarized). Commit ${GITHUB_SHA}."
            echo
            echo "Verify the download: \`shasum -a 256 -c CG-Agent-MacOS-Avatar.zip.sha256\`"
            echo "Gatekeeper may require Open Anyway (System Settings > Privacy & Security)."
            if [ -n "${USER_NOTES:-}" ]; then
              echo
              printf '%s\n' "$USER_NOTES"
            fi
          } > release-notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "CG-Agent-MacOS-Avatar $TAG" \
            --notes-file release-notes.md \
            "${release_flags[@]}" \
            release-assets/CG-Agent-MacOS-Avatar.zip \
            release-assets/CG-Agent-MacOS-Avatar.zip.sha256
