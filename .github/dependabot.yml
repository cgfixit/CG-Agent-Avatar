version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Let fresh releases age before they reach a PR (yanks, compromised publishes).
    cooldown:
      default-days: 7
    groups:
      objc2:
        patterns: ["objc2*"]
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 0.13 changes the TLS root-store API and crypto provider; it is a reviewed
      # migration (docs/BUILD.md), not an automatic bump.
      - dependency-name: reqwest
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      artifact-actions:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
